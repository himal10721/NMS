<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background: #f3f5f7;
            color: #17212b;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        main {
            background: #ffffff;
            border: 1px solid #d7dde3;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(23, 33, 43, 0.08);
            margin: 10vh auto;
            max-width: 380px;
            padding: 32px;
        }
        h1 { margin-top: 0; }
        label {
            display: block;
            font-weight: bold;
            margin-top: 16px;
        }
        input {
            box-sizing: border-box;
            margin-top: 6px;
            padding: 10px;
            width: 100%;
        }
        button {
            background: #155eef;
            border: 0;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            margin-top: 22px;
            padding: 11px 18px;
            width: 100%;
        }
        .error {
            background: #fff0f0;
            border: 1px solid #d92d20;
            color: #912018;
            padding: 10px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Login</h1>
        <p>Sign in with your authorised account.</p>

        {% if form.errors %}
            <p class="error">The username or password was incorrect.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
